{% extends "base.html" %}{% block content %}<h1>Fees</h1><form method="post" class="row g-2">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="col"><select class="form-select" name="student_id">{% for s in students %}<option value="{{ s.id }}">{{ s.full_name }} ({{ s.admission_no }})</option>{% endfor %}</select></div>
<div class="col"><input class="form-control" name="year" value="2026-2027" required></div><div class="col"><input class="form-control" type="number" step="0.01" min="0" name="total_fee" placeholder="Total fee" required></div><div class="col"><button class="btn btn-primary">Add fee</button></div></form>
<table class="table mt-3"><tr><th>Student</th><th>Year</th><th>Total</th><th>Record payment</th></tr>{% for f in records %}<tr><td>{{ f.student.full_name }}</td><td>{{ f.academic_year }}</td><td>{{ f.total_fee }}</td><td><form method="post" action="{{ url_for('fee_payment',fid=f.id) }}" class="d-flex gap-1"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input class="form-control form-control-sm" name="amount" type="number" step="0.01" placeholder="Amount" required><input class="form-control form-control-sm" name="receipt_no" placeholder="Receipt"><button class="btn btn-sm btn-success">Pay</button></form></td></tr>{% endfor %}</table>{% endblock %}
