<style>
    body { background: #f4f6fb !important; font-family: Inter, Arial, sans-serif; }

    .erp-layout { display: flex; gap: 22px; }

    .erp-sidebar {
        width: 235px; flex-shrink: 0; background: #172554; border-radius: 18px;
        padding: 25px 16px; color: white; min-height: 690px;
    }
    .erp-sidebar h4 { font-weight: 800; margin-bottom: 30px; }
    .sidebar-label { font-size: 11px; letter-spacing: .08em; color: rgba(255,255,255,.5);
        margin: 18px 6px 8px; text-transform: uppercase; }
    .sidebar-link {
        display: block; color: #c7d2fe; text-decoration: none; padding: 11px 14px;
        margin-bottom: 6px; border-radius: 9px; transition: .2s; font-size: 14px;
    }
    .sidebar-link:hover, .sidebar-link.active { color: white; background: #3730a3; }

    .erp-main { flex: 1; min-width: 0; }

    .stat-card {
        border: 0; border-radius: 17px; padding: 23px; background: white;
        box-shadow: 0 5px 22px rgba(30, 40, 80, .045); height: 100%; transition: .2s;
    }
    .stat-card:hover { transform: translateY(-3px); }
    .stat-icon { width: 48px; height: 48px; border-radius: 13px; display: grid; place-items: center; font-size: 23px; }
    .stat-number { font-size: 32px; font-weight: 800; margin-top: 13px; }

    .content-card {
        background: white; padding: 24px; border-radius: 17px;
        box-shadow: 0 5px 22px rgba(30, 40, 80, .045); height: 100%;
    }

    .quick-link {
        display: flex; align-items: center; gap: 13px; text-decoration: none; color: #25304a;
        padding: 14px; border: 1px solid #edf0f5; border-radius: 12px; margin-bottom: 12px; transition: .2s;
    }
    .quick-link:hover { background: #eef2ff; border-color: #c7d2fe; color: #3730a3; }
    .quick-icon { width: 40px; height: 40px; display: grid; place-items: center; background: #eef2ff; border-radius: 10px; font-size: 19px; }

    .erp-table { width: 100%; border-collapse: separate; border-spacing: 0; }
    .erp-table th {
        font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: #6b7280;
        padding: 12px 14px; background: #f8f9fd; border-bottom: 1px solid #edf0f5; white-space: nowrap;
    }
    .erp-table th:first-child { border-radius: 10px 0 0 10px; }
    .erp-table th:last-child  { border-radius: 0 10px 10px 0; }
    .erp-table td { padding: 13px 14px; border-bottom: 1px solid #edf0f5; vertical-align: middle; }
    .erp-table tr:last-child td { border-bottom: 0; }
    .erp-table tbody tr:hover { background: #fafbff; }

    .avatar {
        width: 38px; height: 38px; border-radius: 50%; background: #eef2ff; color: #3730a3;
        display: inline-grid; place-items: center; font-weight: 700; font-size: 14px; flex-shrink: 0;
    }

    .btn-erp { background: #4338ca; border: none; border-radius: 10px; color: white; font-weight: 600; padding: 10px 20px; }
    .btn-erp:hover { background: #312e81; color: white; }
    .btn-soft { background: #eef2ff; color: #3730a3; border: 0; border-radius: 9px; font-weight: 600; font-size: 13px; padding: 7px 13px; text-decoration: none; display: inline-block; }
    .btn-soft:hover { background: #c7d2fe; color: #312e81; }

    .erp-card-form .form-control, .erp-card-form .form-select { padding: 11px; border-radius: 10px; }

    /* attendance pills */
    .att-group { display: inline-flex; gap: 6px; }
    .att-pill { cursor: pointer; margin: 0; }
    .att-pill input { display: none; }
    .att-pill span {
        display: inline-block; padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: 600;
        border: 1px solid #e1e5ef; color: #6b7280; transition: .15s; background: white;
    }
    .att-pill.p input:checked + span { background: #dcfce7; border-color: #16a34a; color: #166534; }
    .att-pill.a input:checked + span { background: #fee2e2; border-color: #dc2626; color: #991b1b; }
    .att-pill.l input:checked + span { background: #fef3c7; border-color: #d97706; color: #92400e; }

    .mini-stat { border-radius: 12px; padding: 12px 18px; font-weight: 700; }

    @media (max-width: 900px) {
        .erp-layout { flex-direction: column; }
        .erp-sidebar { width: 100%; min-height: auto; }
        .sidebar-navigation { display: grid; grid-template-columns: repeat(2, 1fr); gap: 5px; }
    }
    @media (max-width: 500px) { .sidebar-navigation { grid-template-columns: 1fr; } }
</style>
