{% extends "teacher_base.html" %}

{% block teacher_content %}

<div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4">
    <div>
        <p class="text-primary fw-bold small mb-1">EXAMS &amp; MARKS</p>
        <h2 class="fw-bold mb-1">Edit Exam</h2>
        <p class="text-secondary mb-0">{{ exam.classroom.label }} &bull; {{ exam.subject.name }}</p>
    </div>
    <a href="{{ url_for('exams_page') }}" class="btn btn-outline-secondary btn-sm">
        &larr; Back to Exams
    </a>
</div>

<div class="row justify-content-center">
    <div class="col-12 col-lg-8">
        <div class="content-card">
            <h5 class="fw-bold mb-3">Update Exam Details</h5>

            <form method="POST" class="erp-card-form">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div class="mb-3">
                    <label class="form-label fw-semibold">Exam / Test Name <span class="text-danger">*</span></label>
                    <input type="text" name="name" class="form-control" value="{{ exam.name }}" required>
                </div>

                <div class="row g-3 mb-3">
                    <div class="col-12 col-md-6">
                        <label class="form-label fw-semibold">Class &amp; Subject</label>
                        <input type="text" class="form-control bg-light" value="{{ exam.classroom.label }} — {{ exam.subject.name }}" disabled>
                    </div>
                    <div class="col-12 col-md-6">
                        <label class="form-label fw-semibold">Exam Date</label>
                        <input type="date" name="exam_date" class="form-control" value="{{ exam.exam_date.isoformat() if exam.exam_date else '' }}">
                    </div>
                </div>

                <div class="row g-3 mb-4">
                    <div class="col-12 col-md-6">
                        <label class="form-label fw-semibold">Maximum Marks <span class="text-danger">*</span></label>
                        <input type="number" step="0.5" min="1" name="max_marks" class="form-control" value="{{ exam.max_marks }}" required>
                        <small class="text-secondary">Cannot be lower than any recorded marks for this exam.</small>
                    </div>
                    <div class="col-12 col-md-6">
                        <label class="form-label fw-semibold">Exam Room / Venue</label>
                        <input type="text" name="room" class="form-control" placeholder="e.g. Hall A, Room 204" value="{{ exam.room or '' }}">
                        <small class="text-secondary">Optional venue location.</small>
                    </div>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-erp">Save Changes</button>
                    <a href="{{ url_for('exams_page') }}" class="btn btn-outline-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>

{% endblock %}
